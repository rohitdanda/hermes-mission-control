name: mission-control
version: 1.0.0
description: Live mission-control dashboard for Hermes Desktop — tool waterfall, parallel subagent cards, token and estimated-cost meters with a prompt-cache badge, plus budget and possible-loop alerts, streamed in real time. Read-only; nothing leaves the machine.
author: rohitkumardanda
license: MIT
requires_hermes: ">=0.21.6"
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_api_request
  - api_request_error
  - subagent_start
  - subagent_stop
  - pre_approval_request
  - post_approval_response
